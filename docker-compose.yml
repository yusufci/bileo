version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bileo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
      POSTGRES_DB: 
    ports:
      - ":5432"
    volumes:
      - bileo_postgres_data:/var/lib/postgresql/data
      - ./src/server/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bileo_network

networks:
  bileo_network:
    driver: bridge

volumes:
  bileo_postgres_data:
    driver: local
